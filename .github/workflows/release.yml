# Build Windows Electron app on windows-latest and publish GitHub Release assets.
# Trigger: push tag v*  OR  workflow_dispatch (manual).
name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/upload (e.g. v0.2.0). Leave empty to build artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
        shell: pwsh

      - name: Verify bundled drivers
        shell: pwsh
        run: |
          $inf = "drivers/windows10/qcser.inf"
          if (-not (Test-Path $inf)) { throw "Missing $inf — drivers must be committed" }
          Get-ChildItem drivers/windows10 -Filter *.inf | ForEach-Object { $_.FullName }
          if (-not (Test-Path "scripts/Install-Drivers.ps1")) { throw "Missing Install-Drivers.ps1" }

      - name: Build Electron Windows artifacts
        shell: pwsh
        run: npm run build
        env:
          # CI: skip code signing
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect artifacts + SHA256
        id: arts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          $files = @()
          Get-ChildItem -Path dist -File -Recurse | Where-Object {
            $_.Extension -in @('.exe', '.msi') -and $_.Name -notmatch 'uninstall'
          } | ForEach-Object {
            $dest = Join-Path "release-out" $_.Name
            Copy-Item $_.FullName $dest -Force
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash
            $shaName = "$($_.Name).sha256"
            Set-Content -Path (Join-Path "release-out" $shaName) -Value "$hash  $($_.Name)" -NoNewline
            $files += $_.Name
            Write-Host "Asset: $($_.Name) sha256=$hash"
          }
          if ($files.Count -eq 0) { throw "No EXE artifacts found under dist/" }
          Get-ChildItem release-out | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJI-4G-Windows-Toolkit
          path: release-out/*
          if-no-files-found: error

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release + upload EXE
        if: steps.meta.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: release-out/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
