<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; img-src 'self' data:;" />
  <title>来电</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: rgba(28, 28, 30, 0.92);
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --ok: #30d158;
      --bad: #ff453a;
      --line: rgba(255, 255, 255, 0.12);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: rgba(255, 255, 255, 0.94);
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(0, 0, 0, 0.08);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: transparent;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      height: 100%;
      margin: 0;
      padding: 14px 16px 12px;
      border-radius: 16px;
      background: var(--bg);
      backdrop-filter: saturate(160%) blur(22px);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      display: grid;
      grid-template-columns: 44px 1fr auto;
      grid-template-rows: auto auto;
      gap: 4px 12px;
      align-items: center;
      color: var(--ink);
    }
    .avatar {
      grid-row: 1 / span 2;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(180deg, #34c759, #248a3d);
      color: #fff;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.35);
    }
    .kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .number {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
    }
    .actions {
      grid-row: 1 / span 2;
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    button {
      -webkit-app-region: no-drag;
      border: none;
      border-radius: 999px;
      height: 36px;
      min-width: 72px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      color: #fff;
    }
    button:active { transform: scale(0.97); }
    .answer { background: var(--ok); }
    .reject { background: var(--bad); }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-label="来电">
    <div class="avatar" aria-hidden="true">☎</div>
    <p class="kicker">来电</p>
    <div class="actions">
      <button type="button" class="answer" id="btnAnswer">接听</button>
      <button type="button" class="reject" id="btnReject">拒接</button>
    </div>
    <h1 class="number" id="callerNumber">—</h1>
  </div>
  <audio id="ringAudio" loop preload="auto"></audio>
  <script src="call-card.js"></script>
</body>
</html>
