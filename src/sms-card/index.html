<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; img-src 'self' data:;" />
  <title>新短信</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: rgba(28, 28, 30, 0.94);
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #0a84ff;
      --line: rgba(255, 255, 255, 0.12);
      --chip: rgba(10, 132, 255, 0.22);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: rgba(255, 255, 255, 0.96);
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(0, 0, 0, 0.08);
        --chip: rgba(0, 113, 227, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: transparent; user-select: none; -webkit-app-region: drag;
    }
    .card {
      height: 100%; padding: 12px 14px;
      border-radius: 16px; background: var(--bg);
      backdrop-filter: saturate(160%) blur(22px);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto auto;
      gap: 2px 10px; color: var(--ink); align-items: start;
    }
    .kicker { margin: 0; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: .04em; }
    .from {
      margin: 0; font-size: 15px; font-weight: 650; line-height: 1.25;
      word-break: break-all; overflow-wrap: anywhere; max-width: 100%;
    }
    .region {
      margin: 0; font-size: 11.5px; font-weight: 500; color: var(--muted); line-height: 1.3;
    }
    .region[hidden] { display: none; }
    .preview {
      grid-column: 1 / 2; margin: 2px 0 0; font-size: 12.5px; color: var(--muted);
      line-height: 1.35; max-height: 2.7em; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .actions { grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; -webkit-app-region: no-drag; align-self: start; }
    button {
      -webkit-app-region: no-drag; border: none; border-radius: 999px;
      height: 30px; min-width: 64px; padding: 0 12px; font-size: 12px; font-weight: 650; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .open { background: var(--accent); color: #fff; }
    .dismiss { background: rgba(127,127,127,.25); color: var(--ink); }
    .otp-row { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
    .otp-chip {
      -webkit-app-region: no-drag; border: none; border-radius: 8px;
      background: var(--chip); color: var(--accent); font-weight: 700;
      font-size: 12px; padding: 4px 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-label="新短信">
    <p class="kicker">新短信</p>
    <div class="actions">
      <button type="button" class="open" id="btnOpen">打开</button>
      <button type="button" class="dismiss" id="btnDismiss">关闭</button>
    </div>
    <h1 class="from" id="smsFrom">—</h1>
    <p class="region" id="smsRegion" hidden></p>
    <p class="preview" id="smsPreview"></p>
    <div class="otp-row" id="otpRow" hidden></div>
  </div>
  <audio id="smsAudio" preload="auto"></audio>
  <script src="sms-card.js"></script>
</body>
</html>
